<footer class="relative overflow-hidden bg-brand-surface text-sm">
  <img src="{{ASSETS}}/brand/waves.svg" alt="" width="1440" height="411" class="pointer-events-none absolute top-0 left-1/2 w-[1440px] max-w-none -translate-x-1/2 opacity-5 lg:w-full" />
  <div class="relative mx-auto flex max-w-360 flex-col gap-8 px-4 pt-10 pb-6 lg:gap-12 lg:px-30 lg:pt-16 lg:pb-8">
    <div class="flex flex-col gap-8 lg:flex-row lg:gap-16">
      <div class="flex flex-col gap-6 lg:flex-1">
        <a href="/" aria-label="INAP, ir al inicio" class="self-start rounded-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-surface-content"><img src="{{ASSETS}}/brand/logo-white.svg" alt="" width="109" height="67" class="w-[109px]" /></a>
        <address class="not-italic">
          <ul class="flex flex-col gap-2.5 text-brand-surface-muted">
            <li class="flex items-start gap-2.5"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mt-px shrink-0 text-brand-surface-muted"><use href="{{ASSETS}}/lucide/sprite.svg#map-pin" /></svg><span>{{direccion}}</span></li>
            <li class="flex items-start gap-2.5"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mt-px shrink-0 text-brand-surface-muted"><use href="{{ASSETS}}/lucide/sprite.svg#phone" /></svg><span><a href="tel:{{tel}}" class="rounded-sm text-brand-surface-muted hover:text-brand-surface-content hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-surface-content">{{telefono}}</a></span></li>
            <li class="flex items-start gap-2.5"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mt-px shrink-0 text-brand-surface-muted"><use href="{{ASSETS}}/lucide/sprite.svg#mail" /></svg><span><a href="mailto:{{correo}}" class="rounded-sm text-brand-surface-muted hover:text-brand-surface-content hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-surface-content">{{correo}}</a></span></li>
          </ul>
        </address>
      </div>
      <nav aria-label="Pie de página" class="grid grid-cols-2 gap-x-6 gap-y-8 lg:flex lg:gap-16 lg:[&>*]:w-45">
        {{columnas}}
      </nav>
    </div>
    <div class="flex flex-col gap-4 border-t border-brand-surface-line pt-6 text-xs lg:flex-row lg:items-center lg:justify-between lg:pt-8">
      <p class="text-brand-surface-muted">© {{anio}} INAP — Instituto Nacional de Administración Pública. Guatemala, C. A.</p>
      <ul aria-label="Redes sociales" class="flex gap-5 font-semibold">
        {{redes}}
      </ul>
    </div>
  </div>
</footer>
