<div class="flex flex-col gap-4 text-sm">
  <p class="font-medium text-base-content">Contacto</p>
  <address class="not-italic">
    <ul class="flex flex-col gap-4 text-base-content">
      <li class="flex items-start gap-2.5"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mt-px shrink-0 text-neutral-text"><use href="{{ASSETS}}/lucide/sprite.svg#phone" /></svg><a href="tel:{{tel}}" class="rounded-sm hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-text">{{telefono}}</a></li>
      <li class="flex items-start gap-2.5"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mt-px shrink-0 text-neutral-text"><use href="{{ASSETS}}/lucide/sprite.svg#mail" /></svg><a href="mailto:{{correo}}" class="rounded-sm hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-text">{{correo}}</a></li>
      <li class="flex items-start gap-2.5"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mt-px shrink-0 text-neutral-text"><use href="{{ASSETS}}/lucide/sprite.svg#map-pin" /></svg><span>{{direccion}}</span></li>
    </ul>
  </address>
</div>
